[tasks.lint]
description = "Validate role YAML and task structure without changes"
run = "./make.sh lint"

[tasks.test]
description = "Run role safety regression tests"
run = "./make.sh test"

[tasks.check]
description = "Check role structure, regressions and whitespace"
run = "./make.sh check"

[tasks.format]
description = "No formatter configured; kept for the make.sh contract"
run = "./make.sh format"

[tasks.release]
description = "Publish the remote main as an immutable release: mise run release v1.2.0"
run = "uv run --locked python scripts/release.py"
