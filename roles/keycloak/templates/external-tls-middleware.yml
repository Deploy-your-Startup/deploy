apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-external-tls
  namespace: "{{ keycloak_namespace }}"
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: https
      X-Forwarded-Host: "{{ keycloak_hostname }}"
      X-Forwarded-Port: "{{ keycloak_hostname.split(':')[1] | default('443') }}"
