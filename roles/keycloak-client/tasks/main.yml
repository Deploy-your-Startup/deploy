---
- name: Require explicit authorization from the cluster owner
  ansible.builtin.assert:
    that:
      - startup_cluster_managed | default(true) | bool
      - startup_keycloak_operator | default(false) | bool
    fail_msg: Configure realms and clients from the cluster owner project with startup_keycloak_operator enabled.

- name: Require a nonempty list of client declarations
  ansible.builtin.assert:
    that:
      - keycloak_clients | type_debug == 'list'
      - keycloak_clients | length > 0

- name: Validate required client declaration fields
  ansible.builtin.assert:
    that:
      - keycloak_client is mapping
      - keycloak_client.namespace is defined
      - keycloak_client.realm is defined
      - keycloak_client.client_id is defined
      - keycloak_client.origin is defined
  loop: "{{ keycloak_clients }}"
  loop_control:
    loop_var: keycloak_client

- name: Require one client declaration per application namespace
  ansible.builtin.assert:
    that:
      - (keycloak_clients | map(attribute='namespace') | unique | length) == (keycloak_clients | length)

- name: Reject duplicate clients in the same realm
  ansible.builtin.assert:
    that:
      - (keycloak_client_pairs | unique(case_sensitive=true) | length) == (keycloak_clients | length)
    fail_msg: Each realm and client ID pair must be assigned to a single application namespace.
  vars:
    keycloak_client_pairs: >-
      {{ keycloak_clients | map(attribute='realm') |
         zip(keycloak_clients | map(attribute='client_id')) | map('join', '/') | list }}

- name: Read shared Keycloak administrator credentials
  kubernetes.core.k8s_info:
    kind: Secret
    namespace: "{{ keycloak_namespace }}"
    name: keycloak
  register: keycloak_client_admin
  no_log: true

- name: Read the shared Keycloak service
  kubernetes.core.k8s_info:
    kind: Service
    namespace: "{{ keycloak_namespace }}"
    name: keycloak
  register: keycloak_client_service

- name: Require the shared service before binding a startup
  ansible.builtin.assert:
    that:
      - keycloak_client_admin.resources | length == 1
      - keycloak_client_service.resources | length == 1
    fail_msg: Run startup ansible deploy --service keycloak from the cluster owner project before binding startups.

- name: Provision each declared realm and client
  ansible.builtin.include_tasks: provision.yml
  loop: "{{ keycloak_clients }}"
  loop_control:
    loop_var: keycloak_client
    label: "{{ keycloak_client.namespace }}"
  vars:
    keycloak_client_target_namespace: "{{ keycloak_client.namespace }}"
    keycloak_realm: "{{ keycloak_client.realm }}"
    keycloak_client_id: "{{ keycloak_client.client_id }}"
    keycloak_client_origin: "{{ keycloak_client.origin }}"
    keycloak_realm_session_settings: "{{ keycloak_client.session_settings | default({}) }}"
    keycloak_realm_passkeys_enabled: "{{ keycloak_client.passkeys_enabled | default(none) }}"
