---
- name: "Read Secret encryption status from the first server"
  ansible.builtin.command: k3s secrets-encrypt status --output json
  delegate_to: "{{ first_master_host }}"
  register: k3s_first_server_encryption
  changed_when: false
  until: k3s_first_server_encryption.rc == 0
  retries: 12
  delay: 5
  when: not is_first_master

- name: "Set Secret encryption for this new server"
  ansible.builtin.set_fact:
    k3s_install_encryption: >-
      {{ {'enable': true} if is_first_master
         else (k3s_first_server_encryption.stdout | from_json) }}

- name: "Require a settled encryption configuration before joining"
  ansible.builtin.assert:
    that:
      - >-
        (k3s_install_encryption.enable is not defined and
         k3s_install_encryption.stage == '' and
         k3s_install_encryption.activekey == '') or
        (k3s_install_encryption.enable and
         k3s_install_encryption.hashmatch | default(false) and
         k3s_install_encryption.stage in ['start', 'reencrypt_finished'] and
         k3s_install_encryption.activekey is match('^(AES-CBC|XSalsa20-POLY1305) '))
    fail_msg: "Cannot match the first server's Secret encryption settings. Finish any encryption maintenance and verify k3s secrets-encrypt status before adding a server."
  when: not is_first_master

- name: "Create K3s server configuration drop-in directory"
  ansible.builtin.file:
    path: /etc/rancher/k3s/config.yaml.d
    state: directory
    mode: "0750"

- name: "Persist Secret encryption settings before installing K3s"
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml.d/00-startup-secret-encryption.yaml
    mode: "0600"
    content: |
      secrets-encryption: {{ k3s_install_encryption.enable | default(false) | bool | lower }}
      {% if k3s_install_encryption.activekey | default('') is match('^XSalsa20-POLY1305 ') %}
      secrets-encryption-provider: secretbox
      {% endif %}
