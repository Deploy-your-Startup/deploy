name: Deploy

on:
  workflow_call:
    inputs:
      health_url:
        description: "Optional public HTTPS health endpoint checked after deployment"
        type: string
        default: ''
      environment:
        description: "Environment which should be deployed"
        required: false
        default: "production"
        type: string
    secrets:
      VAULT_PASSWORD:
        required: true

jobs:
  infrastructure-ready:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Deploy-your-Startup/deploy/.github/actions/wait-for-infrastructure@main

  deploy:
    needs: infrastructure-ready
    concurrency:
      group: startup-deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets the wait step below see in-progress infrastructure runs.
      actions: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check deployment freshness
        id: current
        uses: Deploy-your-Startup/deploy/.github/actions/current-deployment@main

      - name: Require infrastructure still ready
        if: steps.current.outputs.current == 'true'
        uses: Deploy-your-Startup/deploy/.github/actions/wait-for-infrastructure@main
        with:
          timeout_minutes: '0'

      - name: Deploy application
        if: steps.current.outputs.current == 'true'
        uses: Deploy-your-Startup/deploy/.github/actions/deploy@main
        with:
          environment: ${{ inputs.environment || github.event.inputs.environment || 'production' }}
          vault_password: ${{ secrets.VAULT_PASSWORD }}

      - name: Verify deployment health
        if: steps.current.outputs.current == 'true'
        uses: Deploy-your-Startup/deploy/.github/actions/deployment-health@main
        with:
          url: ${{ inputs.health_url }}
