name: Container E2E
on:
  workflow_call:
    inputs:
      run_e2e:
        description: Run browser tests in CI; Dependabot PRs always run them
        type: boolean
        default: true
      directory:
        type: string
        default: e2e_tests
      shards:
        type: number
        default: 1
      runtime_revision:
        description: "Shared CI runtime resolved by the application workflow"
        type: string
        default: ''
      artifact_prefix:
        type: string
        default: e2e
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      run: ${{ steps.mode.outputs.run }}
    steps:
      - id: matrix
        name: Validate shard count
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          count = int(os.environ["SHARDS"])
          if not 1 <= count <= 8:
              raise SystemExit("shards must be an integer between 1 and 8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("value=" + json.dumps(list(range(1, count + 1))) + "\n")
          PYTHON
      - id: mode
        name: Select CI browser tests
        env:
          RUN_E2E: ${{ inputs.run_e2e }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$RUN_E2E" in
            true|false) ;;
            *) echo '::error::RUN_E2E must be true or false'; exit 1 ;;
          esac
          if [ "$RUN_E2E" = false ] && [ "$PR_AUTHOR" != 'dependabot[bot]' ]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo '### E2E: disabled in CI' >> "$GITHUB_STEP_SUMMARY"
            echo 'Browser E2E was not executed in CI. Run all tests locally; CI does not verify that run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo '### E2E: CI execution required' >> "$GITHUB_STEP_SUMMARY"
          fi
  test:
    needs: prepare
    if: needs.prepare.outputs.run == 'true'
    uses: ./.github/workflows/container-e2e-shards.yml
    with:
      matrix: ${{ needs.prepare.outputs.matrix }}
      directory: ${{ inputs.directory }}
      shards: ${{ inputs.shards }}
      runtime_revision: ${{ inputs.runtime_revision }}
      artifact_prefix: ${{ inputs.artifact_prefix }}
