name: Deploy Infrastructure

on:
  workflow_call:
    inputs:
      health_url:
        description: "Optional public HTTPS health endpoint checked after deployment"
        type: string
        default: ''
      environment:
        description: 'Environment which infrastructure should be deployed'
        required: false
        default: 'production'
        type: string
    secrets:
      VAULT_PASSWORD:
        required: true
  workflow_dispatch:
    inputs:
      health_url:
        description: "Optional public HTTPS health endpoint"
        type: string
        default: ''
      environment:
        description: 'Environment which infrastructure should be deployed'
        required: true
        default: 'production'
        type: choice
        options:
          - production

jobs:
  deploy-infrastructure:
    if: github.event_name != 'pull_request'
    concurrency:
      group: startup-deploy-${{ inputs.environment || 'production' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Deploy Infrastructure"
        if: github.event_name != 'pull_request'
        uses: Deploy-your-Startup/deploy/.github/actions/deploy@v2.0.0
        with:
          environment: ${{ inputs.environment || github.event.inputs.environment }}
          service: "infrastructure"
          vault_password: ${{ secrets.VAULT_PASSWORD }}

      - name: Verify deployment health
        if: github.event_name != 'pull_request'
        uses: Deploy-your-Startup/deploy/.github/actions/deployment-health@v2.0.0
        with:
          url: ${{ inputs.health_url }}
